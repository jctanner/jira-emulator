name: GitHub release

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release only after the image was smoke-tested and published
        uses: actions/github-script@v7
        env:
          RELEASE_IMAGE: ${{ inputs.image }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            if (!context.ref.startsWith('refs/tags/')) {
              throw new Error('Releases require a tag');
            }
            const {owner, repo} = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              throw new Error('Release already exists; releases are immutable');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: notes} = await github.rest.repos.generateReleaseNotes({owner, repo, tag_name: tag});
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, draft: false, prerelease: false,
              body: `${notes.body}\n\nSource commit: ${context.sha}\n\nContainer: \`${process.env.RELEASE_IMAGE}\``,
              make_latest: 'true'
            });
