name: Container image

on:
  push:
    branches: [main]
    tags: ["20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release_version.py "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=pr
      - name: Build once for smoke testing and publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: release-smoke:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name release-smoke -p 127.0.0.1:8080:8080 release-smoke:local
          for _ in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8080/rest/api/2/priority > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs release-smoke || true
          docker rm -f release-smoke || true
      - if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if docker manifest inspect "$image:$GITHUB_REF_NAME" > /dev/null 2>manifest-error; then
              echo "Release image already exists; immutable tags cannot be republished."
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|no such manifest|not found' manifest-error; then
              cat manifest-error
              exit 1
            fi
          fi
          while IFS= read -r tag; do
            docker tag release-smoke:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          digest=$(docker image inspect release-smoke:local --format '{{index .RepoDigests 0}}')
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      image: ${{ needs.image.outputs.image }}
